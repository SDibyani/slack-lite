<div class="login-page">

  <div class="login-card">

    <div class="logo">
      Slack-lite
    </div>

    <h1>Welcome back</h1>

    <p class="subtitle">
      Sign in to continue to your workspace
    </p>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        />
      </div>

      <div
        *ngIf="errorMessage"
        class="error-message"
      >
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>

    </form>

  </div>

</div>
